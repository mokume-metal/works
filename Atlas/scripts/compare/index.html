<!doctype html>
<meta charset="utf-8">
<title>比較 (準備中)</title>
<style>
  body { font: 13px -apple-system, sans-serif; margin: 16px; background: #fff; }
  #stage { position: absolute; left: -9999px; top: 0; }
  #log { white-space: pre; font: 12px ui-monospace, Menlo, monospace; }
  #head { font-weight: bold; margin-bottom: 8px; }
</style>
<div id="head">はじめる…</div>
<div id="log"></div>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
// 原典 (processing-website が例ごとに配る liveSketch.js) を走らせ、mokume の書き出しと
// 並べた 1 枚を作って送り返す。**献立はサーバが持つ** — /todo がまだ撮っていないものを
// 返すので、ここは空になるまで回すだけでよい。100 本を超えると必ず途中で切れる
// (面が背面へ回る・1 本が落ちる・閉じてしまう) が、開き直せば続きから走る。

const GAP = 16, BAR = 34, PAD = 8;
const head = document.getElementById('head');
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };

const loadImage = (src) => new Promise((ok, ng) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = () => ng(new Error(`読めない: ${src}`));
  img.src = src;
});

// いま走らせている例。**落ちたときにどれだったかを言えるようにする** — p5 の preload の
// 中で落ちると例外が非同期で上がってきて、呼び出し元の try/catch には入らない
let running = null;
const failures = {};
const blame = (e) => { if (running) failures[running] = String(e && e.message || e); };
window.addEventListener('error', (e) => blame(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => blame(e.reason));

// p5 のインスタンスを 1 つ作り、決めた枚数まで進めてから canvas を返す。
// **マウスは一度も動かさない** ので mouseX / mouseY は 0 のまま — mokume 側の
// 書き出し (窓を持たないので入力が来ない) と条件が揃う。
async function runOriginal(item) {
  const source = await (await fetch(`live/${item.slug}.js`)).text();
  const original = new Function(source + '\n; return runLiveSketch;')();
  let started;
  const ready = new Promise((r) => { started = r; });
  // **setup() の中の noLoop() を無効にする。** 効かせると draw が 1 度も走らず面が
  // 黒いまま残る (rAF が回らない面では p5 の自動の 1 枚目も来ない)。比べたいのは
  // 決めた枚数までの絵で、noLoop の有無は「そのあと止まるか」の違いなので絵は変わらない。
  const factory = (s) => {
    s.noLoop = () => {};
    original(s);
    const userSetup = s.setup, userDraw = s.draw;
    // **等倍で描かせる。** 既定は密度 2 なので canvas が 1280x720 になり、640x360 へ
    // 縮めるときに 1px の線が 2 行へ薄く散る (NoLoop の線が 255 ではなく 128 の 2 行に
    // なっていた)。mokume の書き出しは等倍なので、こちらを合わせる。
    //
    // **待ち時間で待たない。** 5 本のときは固定の 400ms で足りたが、本数が増えると
    // 積み上がるうえ、面が背面へ回ると setTimeout が 1 秒へ丸められて数分になる。
    // setup の末尾で合図を返し、資材を読む例だけが実際に待つ形にする。
    s.setup = () => { s.pixelDensity(1); userSetup(); started(); };
    // **draw() を持たない原典がある。** Processing の静止形 (setup も draw も書かず、
    // 上から下へ 1 度だけ走る形) を写した liveSketch は setup しか持たない。
    // 包む前に有無を見ないと、その例だけが `userDraw is not a function` で落ちる
    s.draw = () => { if (userDraw && s.frameCount <= item.frame) userDraw(); };
  };
  const holder = document.createElement('div');
  document.getElementById('stage').appendChild(holder);
  const instance = new p5(factory, holder);
  await ready;

  // **枚数ではなく到達点で回す。** requestAnimationFrame は表に出ていない面では
  // 回らないことがあり、放っておくと setup() の結果だけが残る (実際、背景を setup で
  // 塗る ContinuousLines だけが描けて、他の 4 本が真っ白になった)。かといって
  // 「N 回 redraw する」と書くと、noLoop() を setup で呼ぶ例は p5 が自動で 1 枚
  // 描いているので N+1 枚目になる (NoLoop の線が 1px 上にある絵になっていた)。
  // mokume 側は advance() を N 回で frameCount が N になるので、そこで揃える。
  let guard = 0;
  while (instance.frameCount < item.frame && guard++ < item.frame + 8) instance.redraw();
  if (instance.frameCount < 1) log(`  ${item.slug}: 1 枚も描けていない`);

  const canvas = holder.querySelector('canvas');
  const [w, h] = [instance.width, instance.height];
  const frozen = document.createElement('canvas');
  frozen.width = w; frozen.height = h;
  frozen.getContext('2d').drawImage(canvas, 0, 0, w, h);

  // **WebGL の面は明示的に手放す。** ブラウザが同時に持てるコンテキストは 8〜16 で、
  // 超えると古いものから黙って失われる。remove() は DOM から外すだけで解放は GC 任せ
  // なので、12 本ある WEBGL の例を続けて回すと後ろのほうが真っ黒になる。
  if (item.webgl) {
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    gl?.getExtension('WEBGL_lose_context')?.loseContext();
    canvas.width = canvas.height = 0;
  }
  instance.remove();
  return { canvas: frozen, width: w, height: h };
}

/** 原典が p5 で配られていない例。site が置く 1280x720 の静止画を、面の大きさへ縮める。 */
async function runStill(item) {
  const image = await loadImage(`png/${item.slug}.png`);
  const [w, h] = item.size;
  const frozen = document.createElement('canvas');
  frozen.width = w; frozen.height = h;
  frozen.getContext('2d').drawImage(image, 0, 0, w, h);
  return { canvas: frozen, width: w, height: h };
}

// 原典と mokume の絵が、画素としてどれだけ一致しているか。
// **色が合っているかどうかは目より数で見たほうが速い。**
function difference(left, right, w, h) {
  const read = (canvas) => canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const a = read(left), b = read(right);
  let same = 0, sum = 0, max = 0, count = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.max(
      Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
    if (d === 0) same++;
    sum += d;
    if (d > max) max = d;
    count++;
  }
  return { same: (same / count) * 100, mean: sum / count, max };
}

function compose(left, right, item, diff) {
  const [W, H] = item.size;
  const out = document.createElement('canvas');
  out.width = W * 2 + GAP;
  out.height = BAR + H + PAD + 22;
  const g = out.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, out.width, out.height);

  g.fillStyle = '#111111';
  g.font = 'bold 15px -apple-system, BlinkMacSystemFont, sans-serif';
  g.fillText(item.origin === 'png' ? 'Processing — 原典 (site の静止画)' : 'Processing (p5.js) — 原典', 2, 22);
  g.fillText('mokume — Atlas', W + GAP + 2, 22);

  g.fillStyle = '#666666';
  g.font = '13px -apple-system, BlinkMacSystemFont, sans-serif';
  const label = item.frame > 1 ? `${item.example} — ${item.frame} 枚目` : item.example;
  g.fillText(label, out.width - g.measureText(label).width - 2, 22);

  g.drawImage(left, 0, BAR, W, H);
  g.drawImage(right, W + GAP, BAR, W, H);

  // 面の縁を見せる (黒い絵が背景と溶けるため)
  g.strokeStyle = '#dddddd';
  g.lineWidth = 1;
  g.strokeRect(0.5, BAR + 0.5, W - 1, H - 1);
  g.strokeRect(W + GAP + 0.5, BAR + 0.5, W - 1, H - 1);

  // **測れない例に数字を刷らない。** 一致率だけを見た読み手が「0% = まったく違う」と
  // 読むのを防ぐ。絵そのものに理由が乗っていれば、URL しか見なくても誤解しない
  g.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
  if (diff) {
    g.fillStyle = '#444444';
    const suffix = item.measure === 'resampled' ? '  ・  原典を縮めているので参考値' : '';
    g.fillText(`画素が完全に一致 ${diff.same.toFixed(1)}%  ・  平均差 ${diff.mean.toFixed(2)} / 255`
      + `  ・  最大差 ${diff.max} / 255${suffix}`, 2, BAR + H + 17);
  } else {
    g.fillStyle = '#8a5a00';
    g.fillText(`画素では測れない — ${item.why || '原典と条件が揃わない'}`, 2, BAR + H + 17);
  }
  return out;
}

async function one(item) {
  running = item.example;
  const origin = item.origin === 'png' ? await runStill(item) : await runOriginal(item);
  const [W, H] = item.size;
  const image = await loadImage(`mokume/${item.slug}.png`);
  const ours = document.createElement('canvas');
  ours.width = W; ours.height = H;
  ours.getContext('2d').drawImage(image, 0, 0, W, H);

  // **引き伸ばさない。** 原典と面の大きさが違うなら、揃えた気になった数字より
  // 「揃っていない」と言うほうが正しい (サーバ側が measure を none にしている)
  const measurable = item.measure !== 'none' && origin.width === W && origin.height === H;
  const diff = measurable ? difference(origin.canvas, ours, W, H) : null;
  const sheet = compose(origin.canvas, ours, item, diff);
  await fetch('/save', { method: 'POST', body: item.slug + '|' + sheet.toDataURL('image/png') });
  await fetch('/save', { method: 'POST', body: 'stats|' + JSON.stringify({
    [item.example]: { measure: item.measure, why: item.why, frame: item.frame,
                      width: W, height: H, status: 'ok', diff },
  }) });
  running = null;
  return diff;
}

(async () => {
  const todo = await (await fetch('/todo')).json();
  head.textContent = `${todo.length} 本を撮る`;
  let done = 0;
  for (const item of todo) {
    try {
      const diff = await one(item);
      done++;
      const score = diff ? `一致 ${diff.same.toFixed(1)}% / 平均差 ${diff.mean.toFixed(2)} / 最大差 ${diff.max}` : `測らない (${item.why})`;
      log(`${String(done).padStart(3)}/${todo.length} ${item.example}  ${score}`);
    } catch (e) {
      blame(e);
      log(`      ${item.example}  失敗 ${failures[item.example] || e}`);
      await fetch('/save', { method: 'POST', body: 'stats|' + JSON.stringify({
        [item.example]: { status: 'failed', error: String(failures[item.example] || e) },
      }) });
      running = null;
    }
    head.textContent = `${done} / ${todo.length} 本`;
  }
  document.title = 'done';
  head.textContent = `おわり — ${done} / ${todo.length} 本`;
  log('おわり');
})();
</script>
