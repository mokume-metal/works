<!doctype html>
<meta charset="utf-8">
<title>比較 (準備中)</title>
<style>
  body { font: 13px -apple-system, sans-serif; margin: 16px; background: #fff; }
  #stage { position: absolute; left: -9999px; top: 0; }
  #log { white-space: pre; font: 12px ui-monospace, Menlo, monospace; }
  #head { font-weight: bold; margin-bottom: 8px; }
</style>
<div id="head">はじめる…</div>
<div id="log"></div>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
// 原典 (processing-website が例ごとに配る liveSketch.js) を走らせ、mokume の書き出しと
// 並べた 1 枚を作って送り返す。**献立はサーバが持つ** — /todo がまだ撮っていないものを
// 返すので、ここは空になるまで回すだけでよい。100 本を超えると必ず途中で切れる
// (面が背面へ回る・1 本が落ちる・閉じてしまう) が、開き直せば続きから走る。

const GAP = 16, BAR = 34, PAD = 8;
const head = document.getElementById('head');
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };

const loadImage = (src) => new Promise((ok, ng) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = () => ng(new Error(`読めない: ${src}`));
  img.src = src;
});

// いま走らせている例。**落ちたときにどれだったかを言えるようにする** — p5 の preload の
// 中で落ちると例外が非同期で上がってきて、呼び出し元の try/catch には入らない
let running = null;
const failures = {};
const blame = (e) => { if (running) failures[running] = String(e && e.message || e); };
window.addEventListener('error', (e) => blame(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => blame(e.reason));

// p5 のインスタンスを 1 つ作り、決めた枚数まで進めてから canvas を返す。
// **マウスは一度も動かさない** ので mouseX / mouseY は 0 のまま — mokume 側の
// 書き出し (窓を持たないので入力が来ない) と条件が揃う。
async function runOriginal(item) {
  const source = await (await fetch(`live/${item.slug}.js`)).text();
  const original = new Function(source + '\n; return runLiveSketch;')();
  let started;
  const ready = new Promise((r) => { started = r; });
  // **setup() の中の noLoop() を無効にする。** 効かせると draw が 1 度も走らず面が
  // 黒いまま残る (rAF が回らない面では p5 の自動の 1 枚目も来ない)。比べたいのは
  // 決めた枚数までの絵で、noLoop の有無は「そのあと止まるか」の違いなので絵は変わらない。
  const factory = (s) => {
    s.noLoop = () => {};
    original(s);
    const userSetup = s.setup, userDraw = s.draw;
    // **等倍で描かせる。** 既定は密度 2 なので canvas が 1280x720 になり、640x360 へ
    // 縮めるときに 1px の線が 2 行へ薄く散る (NoLoop の線が 255 ではなく 128 の 2 行に
    // なっていた)。mokume の書き出しは等倍なので、こちらを合わせる。
    //
    // **待ち時間で待たない。** 5 本のときは固定の 400ms で足りたが、本数が増えると
    // 積み上がるうえ、面が背面へ回ると setTimeout が 1 秒へ丸められて数分になる。
    // setup の末尾で合図を返し、資材を読む例だけが実際に待つ形にする。
    // **落ちても合図は返す。** setup の中で投げると started() に届かず、待つ側が
    // 永久に止まる (最初に回したときは資材の取りこぼし 1 本で残り 125 本が止まった)
    s.setup = () => {
      s.pixelDensity(1);
      try { userSetup(); } catch (e) { blame(e); }
      started();
    };
    // **draw() を持たない原典がある。** Processing の静止形 (setup も draw も書かず、
    // 上から下へ 1 度だけ走る形) を写した liveSketch は setup しか持たない。
    // 包む前に有無を見ないと、その例だけが `userDraw is not a function` で落ちる
    s.draw = () => { if (userDraw && s.frameCount <= item.frame) userDraw(); };
  };
  const holder = document.createElement('div');
  document.getElementById('stage').appendChild(holder);
  const instance = new p5(factory, holder);
  // **返らない setup がある。** p5 の preload は資材を読み終えるまで setup を呼ばない
  // ので、site が別のフォルダから読む絵 (livesketch-manual) を配り損ねると、そこで
  // 永久に待つ。1 本の取りこぼしで残り全部が止まらないよう、期限を切って先へ進む
  await Promise.race([ready, new Promise((r) => setTimeout(r, 6000))]);
  if (instance.frameCount < 0) log(`  ${item.slug}: setup が返らない`);

  // **枚数ではなく到達点で回す。** requestAnimationFrame は表に出ていない面では
  // 回らないことがあり、放っておくと setup() の結果だけが残る (実際、背景を setup で
  // 塗る ContinuousLines だけが描けて、他の 4 本が真っ白になった)。かといって
  // 「N 回 redraw する」と書くと、noLoop() を setup で呼ぶ例は p5 が自動で 1 枚
  // 描いているので N+1 枚目になる (NoLoop の線が 1px 上にある絵になっていた)。
  // mokume 側は advance() を N 回で frameCount が N になるので、そこで揃える。
  let guard = 0;
  while (instance.frameCount < item.frame && guard++ < item.frame + 8) instance.redraw();
  if (instance.frameCount < 1) log(`  ${item.slug}: 1 枚も描けていない`);

  const canvas = holder.querySelector('canvas');
  // **面が作られないことがある。** setup が資材を待って返らないまま期限が来ると、
  // canvas がまだ無い。ここで言わないと drawImage の型エラーになって理由が消える
  if (!canvas) throw new Error('原典の面が作られなかった (setup が返らない)');
  const [w, h] = [instance.width, instance.height];
  const frozen = document.createElement('canvas');
  frozen.width = w; frozen.height = h;
  frozen.getContext('2d').drawImage(canvas, 0, 0, w, h);

  // **WebGL の面は明示的に手放す。** ブラウザが同時に持てるコンテキストは 8〜16 で、
  // 超えると古いものから黙って失われる。remove() は DOM から外すだけで解放は GC 任せ
  // なので、12 本ある WEBGL の例を続けて回すと後ろのほうが真っ黒になる。
  if (item.webgl) {
    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
    gl?.getExtension('WEBGL_lose_context')?.loseContext();
    canvas.width = canvas.height = 0;
  }
  instance.remove();
  return { canvas: frozen, width: w, height: h };
}

/** 原典が p5 で配られていない例。site が置く 1280x720 の静止画を、面の大きさへ縮める。 */
async function runStill(item) {
  const image = await loadImage(`png/${item.slug}.png`);
  const [w, h] = item.size;
  const frozen = document.createElement('canvas');
  frozen.width = w; frozen.height = h;
  frozen.getContext('2d').drawImage(image, 0, 0, w, h);
  return { canvas: frozen, width: w, height: h };
}

// 原典と mokume の絵が、どれだけ同じ絵になっているか。
//
// **画素どうしの完全一致では測れない。** 実測すると、目には同じ絵なのに数字だけが
// 落ちる原因が 3 つあった。どれも「絵が違う」ではなく「画素の作り方が違う」である:
//
//   1. **線が半画素ずれる** — 1px の線を、p5 は画素の境界にまたがらせ (2 列に 77+77)、
//      mokume は画素に載せる (1 列に 153)。**濃さそのものが変わる**ので、ぼかしても
//      1 画素ずらしても合わない。線でできた例は完全一致がほぼ 0 になる
//   2. **量子化** — mokume は線形の空間で色を持ち、書き出すときに表示値へ戻すので、
//      広い一様な面が 1〜5 だけずれる (Functions の灰色が 191 対 189)
//   3. **色そのものがずれる** — mokume の書き出しは Display P3 で刻まれるので、
//      同じ数から違う色が出る (204,153,0 が 213,150,0 になる)
//
// **1 と 2 は同じ絵、3 は違う絵。** その 2 つを分けるために、原因を名指しできる形で測る:
//
//   その場で一致    そのままの位置で色が差 8 以内 (目で見て同じ色) の割合
//   半画素で一致    mokume を半画素ずらしてもよいとしたときの割合。**ずらすと合う**なら、
//                  違いの正体は線の載せ方だと言い切れる (ぼかしでは言い切れない)
//   形が一致        明るさの縁 (エッジ) だけを取り出して、1 画素の幅を許して比べた割合。
//                  色が違っても縁は同じ場所に立つので、**形と位置だけ**を見られる
//
// **どれが「同じ絵」かは決めない。** 3 つの数と並べた 1 枚を出すところまでが機械の仕事で、
// 見て決めるのは人である。数だけで線を引くと、引いた場所そのものが主張になってしまう。

/** 明るさ (BT.709)。色の違いと形の違いを分けるために、まず明るさだけにする。 */
function luminance(data, w, h) {
  const out = new Float32Array(w * h);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    out[p] = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
  }
  return out;
}

/** 明るさの縁。**色が違っても縁は同じ場所に立つ**ので、形だけを取り出せる。 */
function edges(luma, w, h, threshold) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const gx = x + 1 < w ? Math.abs(luma[i + 1] - luma[i]) : 0;
      const gy = y + 1 < h ? Math.abs(luma[i + w] - luma[i]) : 0;
      out[i] = (gx + gy) >= threshold ? 1 : 0;
    }
  }
  return out;
}

/** 2 つの縁の図が、1 画素の幅を許して重なっている割合。**片側だけ見ると見逃す**ので両側から。 */
function overlap(a, b, w, h) {
  const near = (map, x, y) => {
    for (let dy = -1; dy <= 1; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= h) continue;
      for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx;
        if (xx >= 0 && xx < w && map[yy * w + xx]) return true;
      }
    }
    return false;
  };
  let hit = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (a[i] && !near(b, x, y)) continue;
      if (b[i] && !near(a, x, y)) continue;
      hit++;
    }
  }
  return (hit / (w * h)) * 100;
}

/** 画素どうしの、いちばん大きいずれ (R/G/B/A のうち)。
 *
 * **透明も差である。** 何も塗っていない面 (0,0,0,0) と `background(0)` を塗った面
 * (0,0,0,255) は別の絵で、alpha を見ないとこの 2 つが完全一致になる (LoadingImages が
 * そうだった)。`background()` を呼ばない例は原典側が透明のままなので、ここは効く。
 */
function gap(a, b, i) {
  return Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]),
                  Math.abs(a[i + 2] - b[i + 2]), Math.abs(a[i + 3] - b[i + 3]));
}

/** 面から画素を読む。 */
function pixels(canvas, w, h) {
  return canvas.getContext('2d').getImageData(0, 0, w, h).data;
}

/** **描かれた量** — いちばん多い画素以外の数。背景しか無ければ 0 になる。
 *
 * 一致率は「原典と同じ絵になったか」を表すはずだが、**原典が 1 画素も描いていないと
 * 背景が揃っただけで高い数字が出る**。それを見分けるための物差しで、色そのものは見ない
 * (背景が何色でも、そこに何か載っているかだけを数える)。
 */
function ink(data, w, h) {
  const count = new Map();
  let top = 0;
  for (let i = 0; i < data.length; i += 4) {
    const key = ((data[i] << 24) | (data[i + 1] << 16) | (data[i + 2] << 8) | data[i + 3]) >>> 0;
    const n = (count.get(key) || 0) + 1;
    count.set(key, n);
    if (n > top) top = n;
  }
  return w * h - top;
}

/** どちらの面が背景だけだったか。 */
function blankness(drawn) {
  if (!drawn) return null;
  if (drawn.origin === 0 && drawn.port === 0) return 'both';
  if (drawn.origin === 0) return 'origin';
  if (drawn.port === 0) return 'port';
  return null;
}

/** 測れない理由の文。**台帳へは保存しない** — 撮るたびに描かれた量から作り直す。
 *
 * 保存すると、次に絵が出るようになっても理由だけが残り、台帳が古い話をし続ける。
 */
function reason(blank, why) {
  if (blank === 'origin') return '原典が 1 画素も描かなかった。mokume だけが描いている';
  return why || '原典と条件が揃わない';
}

function difference(originCanvas, ourCanvas, w, h) {
  const read = (canvas) => pixels(canvas, w, h);
  const a = read(originCanvas), b = read(ourCanvas);

  // **半画素ずらした mokume。** 線を画素に載せる (255 が 1 列) のか、境界にまたがらせる
  // (128 が 2 列) のかの違いは、半画素動かすとちょうど入れ替わる。ずらして合えば、
  // 違いの正体は線の載せ方だと**言い切れる**
  const shifted = document.createElement('canvas');
  shifted.width = w; shifted.height = h;
  const sg = shifted.getContext('2d');
  sg.drawImage(ourCanvas, -0.5, -0.5, w, h);
  const c = read(shifted);

  let same = 0, close = 0, near = 0, half = 0, sum = 0, max = 0;
  const count = w * h;
  for (let p = 0; p < count; p++) {
    const i = p * 4;
    const d = gap(a, b, i);
    if (d === 0) same++;
    if (d <= 2) close++;
    if (d <= 8) near++;
    // ずらした写しは右端と下端に 0.5 画素の透明な帯ができる。**そこは「その場」だけを見る** —
    // 埋めてから比べると半透明の例 (Recursion ほか) の絵が濁り、比べる相手が変わってしまう
    const onEdge = (p % w) === w - 1 || p >= (h - 1) * w;
    // その場で合うか、半画素ずらして合うか。**どちらかで合えば同じ絵**
    if (d <= 8 || (!onEdge && gap(a, c, i) <= 8)) half++;
    sum += d;
    if (d > max) max = d;
  }

  const la = luminance(a, w, h), lb = luminance(b, w, h);
  const shape = overlap(edges(la, w, h, 16), edges(lb, w, h, 16), w, h);

  return {
    same: (same / count) * 100, close: (close / count) * 100, near: (near / count) * 100,
    half: (half / count) * 100, shape, mean: sum / count, max,
  };
}

function compose(left, right, item, diff, blank) {
  const [W, H] = item.size;
  const out = document.createElement('canvas');
  out.width = W * 2 + GAP;
  out.height = BAR + H + PAD + 22;
  const g = out.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, out.width, out.height);

  g.fillStyle = '#111111';
  g.font = 'bold 15px -apple-system, BlinkMacSystemFont, sans-serif';
  g.fillText(item.origin === 'png' ? 'Processing — 原典 (site の静止画)' : 'Processing (p5.js) — 原典', 2, 22);
  g.fillText('mokume — Atlas', W + GAP + 2, 22);

  g.fillStyle = '#666666';
  g.font = '13px -apple-system, BlinkMacSystemFont, sans-serif';
  const label = item.frame > 1 ? `${item.example} — ${item.frame} 枚目` : item.example;
  g.fillText(label, out.width - g.measureText(label).width - 2, 22);

  g.drawImage(left, 0, BAR, W, H);
  g.drawImage(right, W + GAP, BAR, W, H);

  // 面の縁を見せる (黒い絵が背景と溶けるため)
  g.strokeStyle = '#dddddd';
  g.lineWidth = 1;
  g.strokeRect(0.5, BAR + 0.5, W - 1, H - 1);
  g.strokeRect(W + GAP + 0.5, BAR + 0.5, W - 1, H - 1);

  // **測れない例に数字を刷らない。** 一致率だけを見た読み手が「0% = まったく違う」と
  // 読むのを防ぐ。絵そのものに理由が乗っていれば、URL しか見なくても誤解しない
  g.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
  if (diff) {
    g.fillStyle = '#444444';
    let suffix = item.measure === 'resampled' ? '  ・  原典を縮めているので参考値' : '';
    // **両方とも背景しか無いなら、そう書く。** 100% と出ていても、揃ったのは背景の色だけで
    // 絵の一致を言っていない (入力を待つ例は 1 枚目がこれになる)
    if (blank === 'both') suffix += '  ・  どちらも背景だけ';
    // **数字が高くても、片方が背景だけなら「揃った」とは言えない。** 絵に書いておく
    else if (blank === 'port') suffix += '  ・  mokume は 1 画素も描いていない';
    else if (blank === 'origin') suffix += '  ・  原典は 1 画素も描いていない';
    g.fillText(`その場で一致 ${diff.near.toFixed(1)}%  ・  半画素ずらして一致 ${diff.half.toFixed(1)}%`
      + `  ・  形が一致 ${diff.shape.toFixed(1)}%  ・  完全一致 ${diff.same.toFixed(1)}%${suffix}`, 2, BAR + H + 17);
  } else {
    g.fillStyle = '#8a5a00';
    g.fillText(`画素では測れない — ${reason(blank, item.why)}`, 2, BAR + H + 17);
  }
  return out;
}

async function one(item) {
  running = item.example;
  const origin = item.origin === 'png' ? await runStill(item) : await runOriginal(item);
  const [W, H] = item.size;
  const image = await loadImage(`mokume/${item.slug}.png`);
  const ours = document.createElement('canvas');
  ours.width = W; ours.height = H;
  ours.getContext('2d').drawImage(image, 0, 0, W, H);

  // **引き伸ばさない。** 原典と面の大きさが違うなら、揃えた気になった数字より
  // 「揃っていない」と言うほうが正しい (サーバ側が measure を none にしている)
  const sameSize = origin.width === W && origin.height === H;

  // **描かれた量を先に数える。** 一致率は「同じ絵になったか」を表すはずなのに、
  // 両側とも背景だけなら「背景の色が揃った」しか言っていない。どちらが描いたかで
  // 測る意味が変わるので、測る前に数える
  const drawn = sameSize
    ? { origin: ink(pixels(origin.canvas, W, H), W, H), port: ink(pixels(ours, W, H), W, H) }
    : null;

  const blank = blankness(drawn);
  // **原典が描いていないなら測らない** — 比べる相手が無く、背景だけが揃った数字を
  // 「98% 同じ」と読まれてしまう (Perspective は fov が 0 になり投影が潰れる)。
  //
  // **移植だけが描いていない場合は測る。** 数字そのものは意味を持つ (原典が描いたものを
  // 落としている、と言っている) ので、消すのではなく絵の上に書き添える。落とすかどうかは
  // publish の --check が原典の描いた量で決める
  const measurable = item.measure !== 'none' && sameSize && blank !== 'origin';

  const diff = measurable ? difference(origin.canvas, ours, W, H) : null;
  const sheet = compose(origin.canvas, ours, item, diff, blank);
  await fetch('/save', { method: 'POST', body: item.slug + '|' + sheet.toDataURL('image/png') });
  await fetch('/save', { method: 'POST', body: 'stats|' + JSON.stringify({
    [item.example]: { measure: item.measure, why: item.why, frame: item.frame,
                      width: W, height: H, status: 'ok', diff, ink: drawn },
  }) });
  running = null;
  return { diff, blank };
}

(async () => {
  const todo = await (await fetch('/todo')).json();
  head.textContent = `${todo.length} 本を撮る`;
  let done = 0;
  for (const item of todo) {
    try {
      const { diff, blank } = await one(item);
      done++;
      const score = diff ? `その場 ${diff.near.toFixed(1)}% / 半画素 ${diff.half.toFixed(1)}% / 形 ${diff.shape.toFixed(1)}% / 完全 ${diff.same.toFixed(1)}%` : `測らない (${reason(blank, item.why)})`;
      log(`${String(done).padStart(3)}/${todo.length} ${item.example}  ${score}`);
    } catch (e) {
      blame(e);
      log(`      ${item.example}  失敗 ${failures[item.example] || e}`);
      await fetch('/save', { method: 'POST', body: 'stats|' + JSON.stringify({
        [item.example]: { status: 'failed', error: String(failures[item.example] || e) },
      }) });
      running = null;
    }
    head.textContent = `${done} / ${todo.length} 本`;
  }
  document.title = 'done';
  head.textContent = `おわり — ${done} / ${todo.length} 本`;
  log('おわり');
})();
</script>
